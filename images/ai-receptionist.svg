<svg width="400" height="400" viewBox="0 0 400 400" xmlns="http://www.w3.org/2000/svg">
  <!-- Background circle -->
  <circle cx="200" cy="200" r="180" fill="#E3F2FD" stroke="#2196F3" stroke-width="3"/>
  
  <!-- Robot head -->
  <rect x="120" y="120" width="160" height="140" rx="20" fill="#2196F3"/>
  
  <!-- Antenna -->
  <line x1="200" y1="120" x2="200" y2="80" stroke="#2196F3" stroke-width="4"/>
  <circle cx="200" cy="70" r="10" fill="#FF9800"/>
  
  <!-- Eyes -->
  <circle cx="160" cy="170" r="20" fill="white"/>
  <circle cx="240" cy="170" r="20" fill="white"/>
  <circle cx="160" cy="170" r="10" fill="#1976D2"/>
  <circle cx="240" cy="170" r="10" fill="#1976D2"/>
  
  <!-- Mouth/smile (curved line) -->
  <path d="M 150 220 Q 200 250 250 220" stroke="white" stroke-width="6" fill="none" stroke-linecap="round"/>
  
  <!-- Phone icon in body -->
  <rect x="170" y="280" width="60" height="80" rx="8" fill="white" stroke="#2196F3" stroke-width="3"/>
  <circle cx="200" cy="350" r="6" fill="#2196F3"/>
  <line x1="180" y1="295" x2="220" y2="295" stroke="#2196F3" stroke-width="2"/>
  
  <!-- Sound waves -->
  <path d="M 280 180 Q 300 200 280 220" stroke="#FF9800" stroke-width="3" fill="none"/>
  <path d="M 290 170 Q 320 200 290 230" stroke="#FF9800" stroke-width="3" fill="none"/>
  <path d="M 300 160 Q 340 200 300 240" stroke="#FF9800" stroke-width="3" fill="none"/>
</svg>
